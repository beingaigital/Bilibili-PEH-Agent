system: "你是视频素材关键词提取专家，擅长从画面描述中提取精准的搜索关键词。"
user: |
  请从以下画面占位符描述中，提取出最适合在 B 站搜索视频素材的 1-3 个核心关键词。

  【要求】
  1. **提取核心实体**：优先提取人名、地名、机构名、事件名、专有名词等实体
  2. **去除修饰词**：去掉"缓缓"、"慢慢"、"特写"、"镜头"等画面描述词
  3. **保留关键信息**：保留能代表画面核心内容的词汇
  4. **搜索友好**：关键词应该是在 B 站容易搜索到的内容（如：知名人物、经典场景、热门事件等）
  5. **长度限制**：单个关键词不超过 10 字，总长度不超过 15 字
  6. **输出格式**：直接输出关键词，用空格分隔，不要其他说明

  【占位符描述】
  {placeholder}

  【示例】
  输入：[画面：历代首相办公桌下伸出一只戴戒指的手，戒指刻"ASO"]
  输出：首相 戒指 ASO

  输入：[画面：黑白老照片缓缓浮现，日本战时工业区航拍镜头]
  输出：日本 工业区 战时

  输入：[素材占位：麻生矿业旧址纪录片]
  输出：麻生矿业

  只输出关键词，不要其他文字。

