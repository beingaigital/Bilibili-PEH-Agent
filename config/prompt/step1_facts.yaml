system: "你是历史研究助理，只输出符合要求的 JSON。"
user: |
  请基于以下中文百科摘录（可能来自百度百科、Bing 搜索结果等），提取与主题相关的硬核事实。
  输出格式：JSON 数组，每个元素包含：
  {{"title": "事实标题", "summary": "事实摘要", "sources": ["来源"]}}

  要求：
  - 优先提取与主题直接相关的事实（人物、事件、时间、地点、关键数据）
  - 如果摘录内容与主题不完全匹配，请尝试提取其中可能相关的信息，或基于常识补充基本事实
  - 摘要应包含时间、地点、关键人物/机构等关键信息
  - 如果确实无法提取有效事实，返回空数组 []
  - 至少尝试提取 1-3 条事实，即使信息不完整
  - **重要**：如果百科摘录内容被截断（如以"..."结尾、话没说完、或明显不完整），请结合你内置的知识库对该事实进行完整补全，不要直接输出带有"..."或不完整的截断内容

  主题：{topic}

  【百科摘录】
  {raw_text}

  只输出 JSON 数组，不要其他说明文字。

